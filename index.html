<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Калькулятор круга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Мини-приложение Telegram: один столбец под телефон. Цвета следуют теме Telegram (светлая/тёмная). Без внешних шрифтов */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --sunken:#E6ECE9; --ink:#13201B; --muted:#55645E; --line:#D2DBD7;
  --accent:#16795A; --on-accent:#FFFFFF; --bad:#B4381F; --bad-soft:#F6E0D9;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#141E1B; --sunken:#1B2723; --ink:#E2ECE8; --muted:#93A39D; --line:#293732;
    --accent:#46C79A; --on-accent:#07130F; --bad:#F08268; --bad-soft:#3A1F19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141E1B; --sunken:#1B2723; --ink:#E2ECE8; --muted:#93A39D; --line:#293732;
  --accent:#46C79A; --on-accent:#07130F; --bad:#F08268; --bad-soft:#3A1F19; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
h1{font-size:21px;line-height:1.2;margin:2px 0 0;font-weight:700}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chips button,.seg button{font:inherit;font-size:14.5px;font-weight:600;padding:9px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;cursor:pointer}
.chips button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border-radius:10px;padding:10px 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select{width:100%;font:600 19px/1.2 var(--mono);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.f select{font:600 16px/1.2 var(--font)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px}
.cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(32px,10vw,42px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big.pos{color:var(--accent)} .big.neg{color:var(--bad)}
.pct{font:700 15px var(--mono);margin-top:3px}
.kv{margin:0;display:grid}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:600 15px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .s dt{color:var(--ink);font-weight:600}
.note{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--sunken)}
.note b{font-family:var(--mono)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13.5px/1.6 var(--mono);background:var(--sunken);border-radius:10px;padding:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{font:inherit;font-weight:700;font-size:15px;padding:12px 8px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btns button.ghost{background:var(--sunken);color:var(--ink)}
.status{min-height:1.2em;font-size:13.5px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Калькулятор круга</h1>
    <p class="sub">Наличные → касса → покупка USDT → продажа</p>
  </header>

  <form class="card" id="f" autocomplete="off">
    <div class="chips" role="group" aria-label="Сумма круга">
      <button type="button" data-a="300000">300 тыс.</button>
      <button type="button" data-a="1000000">1 млн</button>
      <button type="button" data-a="5000000">5 млн</button>
      <button type="button" data-a="10000000">10 млн</button>
    </div>
    <div class="f"><label for="amount">Сумма круга, ₽</label><input id="amount" inputmode="numeric" value="300 000"></div>
    <div class="row">
      <div class="f"><label for="buy">Курс покупки</label><input id="buy" inputmode="decimal" value="85,08"></div>
      <div class="f"><label for="sell">Курс продажи</label><input id="sell" inputmode="decimal" value="87,27"></div>
    </div>
    <div class="f">
      <span class="lbl">Кому продаём</span>
      <div class="seg" role="group" aria-label="Кому продаём">
        <button type="button" data-ch="traders" aria-pressed="true">Трейдерам</button>
        <button type="button" data-ch="office" aria-pressed="false">Офис биржи</button>
      </div>
    </div>
    <div class="f" id="box-traders"><label for="tc">Доплата трейдеров</label>
      <div class="unit"><input id="tc" inputmode="decimal" value="1 500"><select id="tcu" aria-label="Единица доплаты"><option value="rub" selected>₽</option><option value="pct">%</option></select></div>
    </div>
    <div class="row" id="box-office" hidden>
      <div class="f"><label for="exf">Комиссия биржи, %</label><input id="exf" inputmode="decimal" value="0,1"></div>
      <div class="f"><label for="outf">Выдача наличных, %</label><input id="outf" inputmode="decimal" value="0,3"></div>
    </div>
    <div class="row">
      <div class="f"><label for="fee">Комиссия кассы, ₽</label><input id="fee" inputmode="numeric" value="5 000"></div>
      <div class="f"><label for="n">Кругов в неделю</label><input id="n" inputmode="numeric" value="5"></div>
    </div>
  </form>

  <section class="card" aria-live="polite">
    <div>
      <span class="cap">Прибыль за круг</span>
      <div class="big" id="r-profit">—</div>
      <div class="pct" id="r-pct">—</div>
    </div>
    <dl class="kv">
      <div><dt>Получено USDT</dt><dd id="r-usdt">—</dd></div>
      <div><dt>Наличные на выходе</dt><dd id="r-cash">—</dd></div>
      <div class="s"><dt id="r-week-l">За неделю</dt><dd id="r-week">—</dd></div>
      <div class="s"><dt>За месяц</dt><dd id="r-month">—</dd></div>
      <div><dt>За год</dt><dd id="r-year">—</dd></div>
    </dl>
    <p class="note" id="r-be">—</p>
    <p class="note" id="r-cashflow">—</p>
  </section>

  <section class="card">
    <span class="cap">Расчёт по шагам</span>
    <pre id="steps">—</pre>
    <div class="btns">
      <button type="button" id="copy">Скопировать</button>
      <button type="button" class="ghost" id="share">Отправить в чат</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<script>
(function(){
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var inTg = !!(tg && tg.initData);
  if (tg){
    try { tg.ready(); tg.expand(); } catch(e) {}
    var applyTheme = function(){ try { document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light'; } catch(e) {} };
    if (inTg){ applyTheme(); try { tg.onEvent('themeChanged', applyTheme); } catch(e) {} }
  }
  var cloud = inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;

  var $ = function(id){ return document.getElementById(id); };
  var nf0 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
  var nf2 = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
  function minus(s){ return s.replace(/^-/, '−'); }
  function rub(v){ return minus(nf0.format(Math.round(v))) + ' ₽'; }
  function srub(v){ return (Math.round(v) > 0 ? '+' : '') + rub(v); }
  function r2(v){ return minus(nf2.format(v)); }
  function num(s){ var v = parseFloat(String(s).replace(/[\s  ]/g,'').replace(',','.')); return isFinite(v) ? v : NaN; }
  function plural(v, a, b, c){ var m10 = v % 10, m100 = v % 100;
    if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; }

  var IDS = ['amount','buy','sell','tc','tcu','exf','outf','fee','n'];
  var F = {}; IDS.forEach(function(id){ F[id] = $(id); });
  var state = {ch:'traders'};
  var KEY = 'krug_calc_v1';

  function snapshot(){ var o = {ch: state.ch}; IDS.forEach(function(id){ o[id] = F[id].value; }); return JSON.stringify(o); }
  function apply(json){
    try {
      var o = JSON.parse(json || 'null'); if (!o) return false;
      IDS.forEach(function(id){ if (o[id] != null) F[id].value = o[id]; });
      if (o.ch === 'traders' || o.ch === 'office') state.ch = o.ch;
      return true;
    } catch(e) { return false; }
  }
  var timer = null;
  function save(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var s = snapshot();
      try { localStorage.setItem(KEY, s); } catch(e) {}
      if (cloud){ try { cloud.setItem(KEY, s, function(){}); } catch(e) {} }
    }, 400);
  }

  function setChannel(ch){
    state.ch = ch;
    document.querySelectorAll('[data-ch]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.ch === ch ? 'true' : 'false'); });
    $('box-traders').hidden = ch !== 'traders';
    $('box-office').hidden = ch !== 'office';
  }
  function markChips(){
    var A = num(F.amount.value);
    document.querySelectorAll('[data-a]').forEach(function(b){ b.setAttribute('aria-pressed', num(b.dataset.a) === A ? 'true' : 'false'); });
  }

  function calc(){
    var A = num(F.amount.value), b = num(F.buy.value), s = num(F.sell.value), fee = num(F.fee.value), n = num(F.n.value);
    var tc = num(F.tc.value), pctUnit = F.tcu.value === 'pct', ex = num(F.exf.value) / 100, out = num(F.outf.value) / 100;
    var trad = state.ch === 'traders';
    var ok = [A,b,s,fee,n].every(isFinite) && A > fee && fee >= 0 && b > 0 && s > 0 && n >= 0 &&
             (trad ? isFinite(tc) && tc >= 0 : isFinite(ex) && isFinite(out) && ex >= 0 && out >= 0 && ex < 1 && out < 1);
    if (!ok){
      ['r-profit','r-pct','r-usdt','r-cash','r-week','r-month','r-year'].forEach(function(id){ $(id).textContent = '—'; });
      $('r-profit').className = 'big';
      $('r-be').textContent = 'Проверьте числа: сумма больше комиссии кассы, курсы больше нуля.';
      $('r-cashflow').textContent = '—'; $('steps').textContent = '—';
      return;
    }
    var net = A - fee, usdt = net / b, sale = usdt * s, cash, bonus = 0, exRub = 0, outRub = 0, be;
    if (trad){
      bonus = pctUnit ? sale * tc / 100 : tc;
      cash = sale + bonus;
      be = pctUnit ? A * b / (net * (1 + tc / 100)) : (A - bonus) * b / net;
    } else {
      exRub = sale * ex; outRub = (sale - exRub) * out;
      cash = sale - exRub - outRub;
      be = A * b / (net * (1 - ex) * (1 - out));
    }
    var p = cash - A, week = p * n, month = week * 52 / 12, year = week * 52;
    var circles = nf0.format(n) + ' ' + plural(Math.round(n), 'круг', 'круга', 'кругов');

    $('r-profit').textContent = srub(p);
    $('r-profit').className = 'big ' + (p >= 0 ? 'pos' : 'neg');
    $('r-pct').textContent = (p > 0 ? '+' : '') + r2(p / A * 100) + ' % за круг';
    $('r-usdt').textContent = r2(usdt) + ' USDT';
    $('r-cash').textContent = rub(cash);
    $('r-week-l').textContent = 'За неделю, ' + circles;
    $('r-week').textContent = srub(week);
    $('r-month').textContent = srub(month);
    $('r-year').textContent = srub(year);
    $('r-be').innerHTML = 'В ноль при продаже по <b>' + r2(be) + '</b>. Дешевле — круг в минус.';
    $('r-cashflow').innerHTML = 'Через кассу: <b>' + rub(A * n) + '</b> в неделю, <b>' + rub(A * n * 52 / 12) + '</b> в месяц.';

    var L = [];
    L.push('Касса: ' + rub(A) + ' − ' + rub(fee) + ' = ' + rub(net));
    L.push('USDT: ' + nf0.format(Math.round(net)) + ' / ' + r2(b) + ' = ' + r2(usdt) + ' USDT');
    if (trad){
      L.push('Продажа трейдерам: ' + r2(usdt) + ' × ' + r2(s) + ' = ' + rub(sale));
      L.push('Доплата трейдеров: +' + rub(bonus) + ' (' + r2(pctUnit ? tc : bonus / sale * 100) + ' %)');
    } else {
      L.push('Продажа через офис: ' + r2(usdt) + ' × ' + r2(s) + ' = ' + rub(sale));
      L.push('Комиссия биржи ' + r2(ex * 100) + ' %: −' + rub(exRub));
      L.push('Выдача наличных ' + r2(out * 100) + ' %: −' + rub(outRub));
    }
    L.push('Итого наличными: ' + rub(cash));
    L.push('Прибыль: ' + rub(cash) + ' − ' + rub(A) + ' = ' + srub(p) + ' (' + r2(p / A * 100) + ' %)');
    L.push('За неделю (' + circles + '): ' + srub(week));
    L.push('За месяц: ' + srub(month));
    $('steps').textContent = L.join('\n');
  }

  function status(msg, ok){
    $('status').textContent = msg;
    if (ok && tg && tg.HapticFeedback){ try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {} }
    setTimeout(function(){ $('status').textContent = ''; }, 2500);
  }
  function selectSteps(){
    var r = document.createRange(); r.selectNodeContents($('steps'));
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }

  document.querySelectorAll('[data-a]').forEach(function(btn){
    btn.addEventListener('click', function(){ F.amount.value = nf0.format(num(btn.dataset.a)); markChips(); calc(); save(); });
  });
  document.querySelectorAll('[data-ch]').forEach(function(btn){
    btn.addEventListener('click', function(){ setChannel(btn.dataset.ch); calc(); save(); });
  });
  IDS.forEach(function(id){
    F[id].addEventListener(F[id].tagName === 'SELECT' ? 'change' : 'input', function(){ if (id === 'amount') markChips(); calc(); save(); });
  });
  ['amount','fee'].forEach(function(id){
    F[id].addEventListener('blur', function(){ var v = num(F[id].value); if (isFinite(v)) F[id].value = nf0.format(v); });
  });
  F.tcu.addEventListener('change', function(){
    var v = num(F.tc.value);
    if (F.tcu.value === 'pct' && v > 50) F.tc.value = '0,5';
    if (F.tcu.value === 'rub' && v <= 50) F.tc.value = '1 500';
    calc(); save();
  });
  $('f').addEventListener('submit', function(e){ e.preventDefault(); });

  $('copy').addEventListener('click', function(){
    var text = $('steps').textContent;
    var fallback = function(){
      selectSteps();
      try { document.execCommand('copy') ? status('Скопировано', true) : status('Текст выделен — скопируйте вручную'); }
      catch(e){ status('Текст выделен — скопируйте вручную'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ status('Скопировано', true); }, fallback);
    } else fallback();
  });
  $('share').addEventListener('click', function(){
    var url = 'https://t.me/share/url?url=' + encodeURIComponent($('steps').textContent);
    if (inTg && tg.openTelegramLink){ try { tg.openTelegramLink(url); return; } catch(e) {} }
    window.open(url, '_blank');
  });

  function start(){ setChannel(state.ch); markChips(); calc(); }
  try { apply(localStorage.getItem(KEY)); } catch(e) {}
  start();
  if (cloud){
    try { cloud.getItem(KEY, function(err, val){ if (!err && val && apply(val)) start(); }); } catch(e) {}
  }
})();
</script>
</body>
</html>
